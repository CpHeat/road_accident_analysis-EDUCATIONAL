global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi"
    static_configs:
      - targets: ["accident-ml-backend:8000"]
    metrics_path: /metrics

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "uptime-kuma"
    basic_auth:
      username: ""
      password: "__UPTIME_KUMA_API_KEY__"
    static_configs:
      - targets: ["uptime-kuma:3001"]
    metrics_path: /metrics