networks:
  accident-ml:
    name: accident-ml
    driver: bridge

services:
  accident-ml-db:
    image: postgres:17-alpine
    container_name: accident-ml-db
    networks:
      - accident-ml
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d accidents"]
      interval: 60s
      timeout: 10s
      retries: 3

  accident-ml-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # image: ghcr.io/cpheat/road_accident_analysis-educational:1.3.0
    container_name: accident-ml-backend
    depends_on:
      accident-ml-db:
        condition: service_healthy
    networks:
      - accident-ml
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
      - ./backend:/app
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--reload"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  accident-ml-front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: cpheat/accident-ml-front:1.0.3
    container_name: accident-ml-front
    depends_on:
      accident-ml-backend:
        condition: service_healthy
    networks:
      - accident-ml
    ports:
      - "8501:8501"
    environment:
      API_URL: http://accident-ml-backend:8000
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped

  # =========================================================================
  # Monitoring
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - accident-ml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus_data:/prometheus
    depends_on:
      accident-ml-backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - accident-ml
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin      
      - GF_USERS_ALLOW_SIGN_UP=fals
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - accident-ml
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    networks:
      - accident-ml
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    networks:
      - accident-ml
    ports:
      - "3001:3001"
    volumes:
      - ./monitoring/uptime_kuma_data:/app/data
    restart: unless-stopped

volumes:
  backend_storage:
  postgres_data:
